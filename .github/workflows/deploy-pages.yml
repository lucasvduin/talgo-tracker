name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24  # Upgraded to Node 24 to fix the deprecation warning

      - name: Build React Dashboard
        working-directory: ./dashboard
        run: |
          npm install       # Changed from npm ci to npm install
          npm run build
          
      - name: Prepare GitHub Pages Structure
        run: |
          mkdir _site
          
          # 1. Copy the original root files (Your old dashboard and CSV)
          cp index.html _site/ 2>/dev/null || true
          cp hamburg_cph_trains.csv _site/ 2>/dev/null || true
          
          # 2. Copy the built React app into the /dashboard/ subfolder
          cp -r dashboard/dist _site/dashboard

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
